<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <title>Agyx Logistics AI - Hero Banner</title>
  <desc>Agente Autónomo de Factibilidad de Despacho, Flota y Rutas Pesadas con Gobernanza R4R y Memoria Viva</desc>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="50%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#050A14"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111C35"/>
      <stop offset="100%" stop-color="#0C1527"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bg-grad)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>

  <!-- Outer frame border with corner accents -->
  <rect x="15" y="15" width="1170" height="350" rx="10" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 15 335 L 15 365 L 45 365" fill="none" stroke="#38BDF8" stroke-width="3"/>
  <path d="M 1155 365 L 1185 365 L 1185 335" fill="none" stroke="#38BDF8" stroke-width="3"/>

  <!-- Left Column: Branding and System Architecture -->
  <!-- Status Chip -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="168" height="26" rx="6" fill="#0E2238" stroke="#0284C7" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#38BDF8"/>
    <text x="26" y="17" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1">SYS.ONLINE // v2.4</text>
  </g>

  <g transform="translate(225, 42)">
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#132338" stroke="#1E3A5F" stroke-width="1"/>
    <text x="12" y="17" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">SANTIAGO RM [33°26'S 70°39'W]</text>
  </g>

  <!-- Brand Title -->
  <text x="45" y="116" fill="url(#cyan-glow)" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="0.5">AGYX // LOGISTICS_AI</text>
  <text x="45" y="146" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600">Agente Operativo de Despacho, Flota y Rutas Pesadas</text>
  <text x="45" y="172" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400">Gobernanza R4R (Human-in-the-Loop) • Memoria Viva &lt;80 Tokens • Motor Dual Resiliente</text>

  <!-- Value Feature Pills -->
  <g transform="translate(45, 206)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="275" height="42" rx="8" fill="#0C1B33" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#10B981"/>
    <text x="34" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">MOTOR DUAL RESILIENTE</text>
    <text x="34" y="33" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">0-Tokens Local + Gemini 2.5</text>

    <!-- Pill 2 -->
    <rect x="290" y="0" width="280" height="42" rx="8" fill="#0C1B33" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="310" cy="21" r="5" fill="#F59E0B"/>
    <text x="324" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">GOBERNANZA R4R ESTRICTA</text>
    <text x="324" y="33" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">Inactividad = Bloqueo (auto=0)</text>
  </g>

  <g transform="translate(45, 260)">
    <!-- Pill 3 -->
    <rect x="0" y="0" width="275" height="42" rx="8" fill="#0C1B33" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#A855F7"/>
    <text x="34" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">MEMORIA VIVA ADAPTATIVA</text>
    <text x="34" y="33" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">&lt;80 Tokens JSON (v1 ➔ v2)</text>

    <!-- Pill 4 -->
    <rect x="290" y="0" width="280" height="42" rx="8" fill="#0C1B33" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="310" cy="21" r="5" fill="#38BDF8"/>
    <text x="324" y="19" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">145 TESTS AUTOMATIZADOS</text>
    <text x="324" y="33" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">verify_all.py 100/100 Rúbrica</text>
  </g>

  <g transform="translate(45, 322)">
    <text x="0" y="16" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PROYECTO INTEGRADOR SOFTWARE LOGÍSTICO PYMES-FLETES // CERTAMEN 2</text>
  </g>

  <!-- Right Column: Dispatch Tactical Radar Window (x=660, y=36, width=495, height=308) -->
  <g transform="translate(660, 36)">
    <!-- Window Container -->
    <rect x="0" y="0" width="495" height="308" rx="10" fill="url(#panel-grad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Window Topbar -->
    <path d="M 0 10 Q 0 0 10 0 L 485 0 Q 495 0 495 10 L 495 32 L 0 32 Z" fill="#0D1627"/>
    <line x1="0" y1="32" x2="495" y2="32" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="16" r="4.5" fill="#EF4444"/>
    <circle cx="32" cy="16" r="4.5" fill="#F59E0B"/>
    <circle cx="48" cy="16" r="4.5" fill="#10B981"/>
    <text x="66" y="20" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">DISPATCH_TACTICAL_RADAR // RM_NET</text>

    <!-- Radar Center at x=230, y=165 -->
    <!-- Radar Rings -->
    <circle cx="230" cy="165" r="35" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="230" cy="165" r="75" fill="none" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="230" cy="165" r="115" fill="none" stroke="#1E3A5F" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Crosshairs -->
    <line x1="230" y1="45" x2="230" y2="285" stroke="#1E293B" stroke-width="1"/>
    <line x1="110" y1="165" x2="350" y2="165" stroke="#1E293B" stroke-width="1"/>

    <!-- Sweep Line -->
    <line x1="230" y1="165" x2="330" y2="95" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
    <polygon points="230,165 330,95 345,130" fill="#38BDF8" fill-opacity="0.12"/>

    <!-- Nodes & Network -->
    <!-- Santiago Centro Restricted Geofence Polygon (dashed red) -->
    <rect x="210" y="145" width="50" height="40" rx="4" fill="#EF4444" fill-opacity="0.15" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="212" y="140" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">CENTRO &gt;5t</text>

    <!-- Route Line Quilicura -> Santiago Centro -> San Bernardo -->
    <polyline points="190,85 235,165 240,245" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- Quilicura (N1) -->
    <circle cx="190" cy="85" r="5" fill="#38BDF8"/>
    <text x="140" y="80" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">QUILICURA</text>

    <!-- Pudahuel (N2) -->
    <circle cx="140" cy="150" r="5" fill="#38BDF8"/>
    <text x="75" y="153" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">PUDAHUEL</text>

    <!-- Taller Renca (Blocked CAM-04) -->
    <circle cx="215" cy="115" r="5" fill="#EF4444"/>
    <text x="225" y="115" fill="#EF4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">CAM-04 [FRENOS]</text>

    <!-- Lira 953 / Santiago Centro -->
    <circle cx="235" cy="165" r="5" fill="#F59E0B"/>
    <text x="245" y="170" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" font-weight="700">LIRA 953</text>

    <!-- Providencia (N6) -->
    <circle cx="295" cy="140" r="5" fill="#38BDF8"/>
    <text x="305" y="144" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">PROVIDENCIA</text>

    <!-- San Bernardo (N5) -->
    <circle cx="240" cy="245" r="5" fill="#38BDF8"/>
    <text x="180" y="260" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">SAN BERNARDO</text>

    <!-- Bottom Telemetry Card in Window -->
    <g transform="translate(15, 274)">
      <rect x="0" y="0" width="465" height="24" rx="4" fill="#070E1A" stroke="#1E293B" stroke-width="1"/>
      <text x="10" y="16" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">LIVE: agyx-fletes.vercel.app</text>
      <text x="250" y="16" fill="#EF4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">AUTO_APPROVED: 0 (BLOQUEO ACTIVO)</text>
    </g>
  </g>
</svg>