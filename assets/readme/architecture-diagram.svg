<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
  <title>Agyx Logistics AI - Pipeline Diagram</title>
  <desc>Flujo agéntico con radar táctico, motor dual, gobernanza R4R, revisión humana y memoria viva</desc>
  <defs>
    <linearGradient id="pipe-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111D36"/>
      <stop offset="100%" stop-color="#0D1629"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A855F7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="280" rx="10" fill="url(#pipe-bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(35, 25)">
    <text x="0" y="0" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.5">PIPELINE AGÉNTICO // CICLO COMPLETO CON MEMORIA VIVA</text>
    <text x="750" y="0" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">R4R GOVERNANCE • DETERMINISTIC AUTHORITY • HUMAN-IN-THE-LOOP</text>
  </g>

  <!-- Stage 1: Ingesta -->
  <g transform="translate(35, 50)">
    <rect x="0" y="0" width="205" height="150" rx="8" fill="url(#card-grad)" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="28" rx="8" fill="#162947"/>
    <text x="12" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">[01] INGESTA ORDEN</text>
    
    <text x="14" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Validación de Datos</text>
    <text x="14" y="74" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Origen y Destino RM</text>
    <text x="14" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Peso bruto en kg</text>
    <text x="14" y="110" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Ventana horaria</text>
    <text x="14" y="132" fill="#EF4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">Filtro carga peligrosa D.S.298</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="242" y1="125" x2="268" y2="125" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: Tactical Radar -->
  <g transform="translate(270, 50)">
    <rect x="0" y="0" width="205" height="150" rx="8" fill="url(#card-grad)" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="28" rx="8" fill="#162947"/>
    <text x="12" y="18" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">[02] RADAR TÁCTICO</text>

    <text x="14" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Red Vial Santiago</text>
    <text x="14" y="74" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• 7 Nodos e Intersecciones</text>
    <text x="14" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Congestión horaria (1.0x–1.8x)</text>
    <text x="14" y="110" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">• Geocerca Centro &gt;5t (Lira)</text>
    <text x="14" y="132" fill="#EF4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">• Bloqueo taller (CAM-04 frenos)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="477" y1="125" x2="503" y2="125" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: Dual Engine & R4R Guard -->
  <g transform="translate(505, 50)">
    <rect x="0" y="0" width="205" height="150" rx="8" fill="url(#card-grad)" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="28" rx="8" fill="#162947"/>
    <text x="12" y="18" fill="#F59E0B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">[03] MOTOR DUAL &amp; R4R</text>

    <text x="14" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Evaluación Segura</text>
    <text x="14" y="74" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">• 0-Tokens Local (Autoridad)</text>
    <text x="14" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Gemini 2.5 Flash (Explicación)</text>
    <text x="14" y="110" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Cola R4R en SQLite (agyx.db)</text>
    <text x="14" y="132" fill="#EF4444" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700">Inactividad = BLOQUEO ACTIVO</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="712" y1="125" x2="738" y2="125" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: Human Review -->
  <g transform="translate(740, 50)">
    <rect x="0" y="0" width="205" height="150" rx="8" fill="url(#card-grad)" stroke="#1E3A5F" stroke-width="1.5"/>
    <rect x="0" y="0" width="205" height="28" rx="8" fill="#162947"/>
    <text x="12" y="18" fill="#10B981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">[04] REVISIÓN HUMANA</text>

    <text x="14" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Supervisor de Tráfico</text>
    <text x="14" y="74" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11">✅ APROBAR: Despacho Hoy</text>
    <text x="14" y="92" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11">📅 RESERVAR: Despacho Mañana</text>
    <text x="14" y="110" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="11">❌ RECHAZAR: Motivo Obligatorio</text>
    <text x="14" y="132" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">HTTP 400 si motivo vacío</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="947" y1="125" x2="973" y2="125" stroke="#A855F7" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Stage 5: Live Memory -->
  <g transform="translate(975, 50)">
    <rect x="0" y="0" width="190" height="150" rx="8" fill="url(#card-grad)" stroke="#A855F7" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="28" rx="8" fill="#24143D"/>
    <text x="12" y="18" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">[05] MEMORIA VIVA</text>

    <text x="14" y="52" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Destilación &lt;80T</text>
    <text x="14" y="74" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">• Bitácora JSON</text>
    <text x="14" y="92" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Regla Operacional</text>
    <text x="14" y="110" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11">Iteración v1 ➔ v2</text>
    <text x="14" y="132" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">Caso 3: Nocturno/Split</text>
  </g>

  <!-- Feedback Line from Stage 5 back to Stage 3 -->
  <path d="M 1070 200 L 1070 235 L 607 235 L 607 205" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>
  <text x="838" y="252" fill="#C084FC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" text-anchor="middle">RETROALIMENTACIÓN ADAPTATIVA INMEDIATA (MEMORIA VIVA ➔ MOTOR EVALUADOR)</text>
</svg>