<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.3" />

  <!-- Truck Cab and Trailer Silhouette -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trailer -->
    <rect x="36" y="60" width="76" height="54" rx="6" fill="#0f172a" fill-opacity="0.8" />
    <!-- Cab -->
    <path d="M112 78 H136 L152 98 V114 H112 Z" fill="#0f172a" fill-opacity="0.8" />
    <!-- Cab Window -->
    <path d="M116 84 H133 L144 98 H116 Z" fill="#38bdf8" fill-opacity="0.3" stroke-width="3" />
    <!-- Wheels -->
    <circle cx="56" cy="120" r="10" fill="#020617" stroke="#38bdf8" stroke-width="5" />
    <circle cx="92" cy="120" r="10" fill="#020617" stroke="#38bdf8" stroke-width="5" />
    <circle cx="134" cy="120" r="10" fill="#020617" stroke="#38bdf8" stroke-width="5" />
  </g>

  <!-- AI Brain / Spark Star Node in Center of Cargo -->
  <g transform="translate(74, 87)" filter="url(#glow)">
    <circle cx="0" cy="0" r="12" fill="#38bdf8" fill-opacity="0.2" />
    <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z" fill="#38bdf8" />
  </g>

  <!-- Chilean Flag Subtle Dot Accent -->
  <circle cx="156" cy="40" r="5" fill="#ef4444" />
  <circle cx="142" cy="40" r="5" fill="#38bdf8" />
</svg>
